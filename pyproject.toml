[project]
name = "keystone"
version = "1.0.0"
description = "Keystone — Keystone Inference (Self-Hosted LLM Serving) & Keystone Agents (Autonomous Coding Agent)"
license = {text = "Apache-2.0"}
authors = [{name = "Gaurav Gupta", email = "gauravright@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "redis[hiredis]>=8.1.0",
    "qdrant-client>=1.19.1",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.4",
    "httpx>=0.28.1",
    "openai>=3.19.0",
    "anthropic>=1.8.0",
    "docker>=7.2.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "sentence-transformers>=6.1.0",
    "gitpython>=3.1.62",
    "psutil>=7.2.2",
    "temporalio>=1.33.0",
    "prometheus-client>=0.26.0",
    "cryptography>=50.0.1",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "mcp>=2.2.0",
    "croniter>=6.2.4",
]

[project.scripts]
keystone = "src.cli.main:app"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.7.7",
    "pyyaml>=6.0.3",
]
finetuning = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "peft>=0.21.0",
    "trl>=1.13.0",
    "datasets>=5.0.1",
    "bitsandbytes>=0.50.2",
    "accelerate>=1.15.0",
    "wandb>=0.30.0",
    "gguf>=0.19.0", # llama.cpp's GGUF writer, used by the vendored convert_hf_to_gguf.py (src/finetuning/export.py)
    "sentencepiece>=0.2.2", # imported by the converter's vocab handling — the GGUF export fails without it
]
# Ray Train on KubeRay (ADR 0002): the training image and a Ray driver need it; the API process does not
# (it submits jobs over the Ray Jobs REST API — src/finetuning/backends/ray_train.py).
finetuning-ray = [
    "ray[train]>=2.58.0",
]
dev = [
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/GGChamp85/keystone"
Repository = "https://github.com/GGChamp85/keystone"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Benchmark task repositories are fixtures with deliberate bugs, not project code.
extend-exclude = ["benchmarks/tasks/repo/*/repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "PERF", "SIM", "RUF"]
ignore = [
    "B008",     # Depends()/Security() as a default arg is the idiomatic FastAPI DI pattern
    "S101",     # assert is fine in our own test/validation helpers
    "S104",     # 0.0.0.0 binds are deliberate — every service here runs inside a container
    "ASYNC109", # our async functions intentionally take a `timeout` param and enforce it via
                # asyncio.wait_for internally, rather than requiring the caller wrap every call
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # CLI scripts intentionally shell out

[tool.mypy]
# `mypy src/` runs in CI's lint job and must report zero errors — no baseline,
# no ratchet. Third-party packages without stubs (docker, gitpython, some of
# the ML stack) are treated as `Any`; the code paths that touch them are
# still checked where our own annotations say what they return.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["src/db/migrations/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
