# Self-hosted Prometheus scrape config. No remote_write, no external targets —
# air-gap safe by construction.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: keystone-app
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /metrics

  - job_name: keystone-sandbox-daemon
    static_configs:
      - targets: ["sandbox-daemon:9000"]
    metrics_path: /metrics

  - job_name: vllm-coding
    static_configs:
      - targets: ["vllm-coding:8000"]
    metrics_path: /metrics

  - job_name: vllm-coding-fallback
    static_configs:
      - targets: ["vllm-coding-fallback:8000"]
    metrics_path: /metrics

  - job_name: vllm-reasoning
    static_configs:
      - targets: ["vllm-reasoning:8000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
