#
# Azure AKS overlay — layered ON TOP of values-client-vpc.yaml, filling
# every TODO there with what infra/opentofu/modules/azure-aks-gpu actually
# creates (StorageClass names, the GPU node label, the taint the pods
# tolerate). Sized for the azure-pilot environment: one
# Standard_NV36ads_A10_v5 node = one NVIDIA A10 (24 GB), so the coding role
# serves Qwen2.5-Coder-7B-Instruct on a single GPU, exactly as
# values-runpod-test.yaml does — the 8-GPU GLM-5.3-Flash production
# profile from values-client-vpc.yaml does not fit a pilot.
#
#   helm upgrade --install keystone helm/keystone --namespace keystone --create-namespace \
#     -f helm/keystone/values-client-vpc.yaml -f helm/keystone/values-azure.yaml
#
# Verified: renders in CI (`helm template` with both files). Not yet
# applied to a real AKS cluster — see docs/deployment/verification-log.md.

global:
  imageRegistry: "" # the pilot cluster has internet egress: pull vllm/* from Docker Hub. Set the Harbor mirror back for an air-gapped install.

app:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

# Block storage: the module's Premium SSD StorageClass (disk.csi.azure.com, WaitForFirstConsumer).
postgres:
  storageClassName: keystone-managed-premium
redis:
  storageClassName: keystone-managed-premium
qdrant:
  storageClassName: keystone-managed-premium
openbao:
  storageClassName: keystone-managed-premium

sandboxDaemon:
  backend: gvisor # AKS nodes expose no /dev/kvm to pods (nested virtualisation is not enabled on the D/NV v5 sizes) — gVisor runs anywhere
  nodeSelector: null # clears values-client-vpc.yaml's keystone.io/sandbox-capable label: the DaemonSet runs on every system node

vllm:
  coding:
    enabled: true
    gpuCount: 1
    model: "Qwen/Qwen2.5-Coder-7B-Instruct"
    servedModelName: qwen-coder-7b
    maxModelLen: 16384
    toolParser: hermes
    image:
      repository: vllm/vllm-openai
      tag: v0.29.0
    # The module labels GPU nodes nodepool=gpu-coding and taints them
    # nvidia.com/gpu=present:NoSchedule; templates/vllm.yaml already adds a
    # `nvidia.com/gpu` Exists/NoSchedule toleration to every vLLM pod.
    nodeSelector:
      nodepool: gpu-coding
    # Standard_NV36ads_A10_v5: 36 vCPU / 440 GiB — CPU and RAM are not the constraint here.
    resources:
      requests: { cpu: "8", memory: "32Gi", nvidia.com/gpu: "1" }
      limits: { cpu: "16", memory: "64Gi", nvidia.com/gpu: "1" }
  coding-fallback:
    enabled: false # one GPU node in the pilot; enable with a second node pool
  reasoning:
    enabled: false

modelCache:
  storage: 100Gi # Azure Files Premium bills the provisioned share size — keep this to what the weights need
  storageClassName: keystone-azurefile-nfs # RWX: NFS 4.1 Premium file share via the Azure Files CSI driver, shared by every GPU node
  hfOffline: false # the pilot downloads Qwen2.5-Coder-7B into the cache on first start

training:
  nodeSelector:
    nodepool: gpu-coding
  storageClassName: keystone-azurefile-nfs
  defaultNumNodes: 1
  gpusPerNode: 1
  resourcesPerNode:
    requests: { cpu: "8", memory: "32Gi", nvidia.com/gpu: "1" }
    limits: { cpu: "16", memory: "64Gi", nvidia.com/gpu: "1" }

ingress:
  enabled: false # the module installs no ingress controller; reach the API with `kubectl -n keystone port-forward svc/keystone-app 8080:8080`, or enable the AKS application-routing add-on / install ingress-nginx and re-enable with your hostname

secrets:
  useOpenBao: false # the OpenBao SecretProviderClass path needs the Secrets Store CSI driver installed cluster-wide; the pilot uses the chart-generated Secret
