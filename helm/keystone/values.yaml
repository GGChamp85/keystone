# Default values for the Keystone chart. Override per environment with
# values-runpod-test.yaml / values-client-vpc.yaml (helm install -f ...).

global:
  imageRegistry: "" # set to your internal Harbor registry in air-gapped deployments, e.g. registry.internal.keystone.local
  imagePullSecrets: []
  environment: production

image:
  app:
    repository: keystone-app
    tag: latest
    pullPolicy: IfNotPresent
  sandboxDaemon:
    repository: keystone-sandbox-daemon
    tag: latest
    pullPolicy: IfNotPresent
  vllm:
    repository: vllm/vllm-openai
    tag: v0.29.0
    pullPolicy: IfNotPresent

app:
  replicaCount: 2
  port: 8080
  rollout:
    maxSurge: 1 # RollingUpdate with maxUnavailable 0: a replacement is Ready before a replica goes away
    preStopSeconds: 5 # endpoint removal propagates before SIGTERM
    terminationGracePeriodSeconds: 60 # long enough for an in-flight streamed completion to finish
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 2
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }

sandboxDaemon:
  # Runs as a DaemonSet so every node that can host sandboxes has a local
  # daemon instance — a sandbox never crosses the network to reach its
  # execution backend. Needs privileged access (Docker socket or /dev/kvm).
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  backend: gvisor # gvisor | firecracker — firecracker requires KVM-capable nodes (see nodeSelector below)
  nodeSelector: {}
  # nodeSelector:
  #   keystone.io/sandbox-capable: "true"

postgres:
  enabled: true
  storage: 20Gi
  storageClassName: ""
  backup:
    enabled: false # nightly pg_dump CronJob to its own PVC (templates/postgres-backup.yaml); restore with scripts/restore_drill.sh
    schedule: "0 2 * * *"
    retentionDays: 14
    storage: 50Gi
    storageClassName: ""
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

redis:
  enabled: true
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

qdrant:
  enabled: true
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

temporal:
  enabled: true
  image:
    server: { repository: temporalio/auto-setup, tag: "1.24" }
    ui: { repository: temporalio/ui, tag: "2.27.0" }
  namespace: keystone
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }

openbao:
  enabled: true
  image: { repository: openbao/openbao, tag: "2.1" }
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# GPU node pools — one pool per model role (coding / coding fallback /
# reasoning-critic each get their own GPU nodes). Left disabled by default
# so this chart deploys cleanly on non-GPU clusters (e.g. for CI/lint/
# template testing) — a client VPC install sets these true.
vllm:
  # GLM-5.3-Flash (zai-org, MIT) — primary coding model. Its glm5_next
  # architecture (hybrid MLA + gated-linear-attention + sparse indexer,
  # 288-expert MoE, natively FP8 on disk) is new enough that vLLM ships a
  # dedicated pre-built image for it rather than a generic version tag —
  # hence the per-role `image` override below (every other role uses the
  # chart-wide `image.vllm` tag). See src/inference/config.py's
  # coding_model_config() docstring for the verified footprint details.
  coding:
    enabled: false
    gpuCount: 8
    # replicas: N independent full model instances for horizontal
    # throughput scaling (real load balancing — see templates/vllm.yaml's
    # file-level comment). nodeCount: > 1 pipeline-parallels ONE instance
    # across that many nodes for a model too big for one node's GPU pool.
    # Never raise both above 1 for the same role.
    replicas: 1
    nodeCount: 1
    # KV-cache dtype — "fp8"/"fp8_e4m3" frees real KV-cache headroom on a
    # fixed GPU budget at a real (if usually small) numerical cost; leave
    # unset until verified on real hardware. See
    # src/inference/config.py's VLLMConfig.kv_cache_dtype.
    kvCacheDtype: ""
    # Promoted fine-tuned adapters served next to the base model (src/inference/lora_registry.py).
    # enabled also sets VLLM_ALLOW_RUNTIME_LORA_UPDATING so a promotion loads live, no restart;
    # `modules` is the restart-time list — copy it from <FINETUNING_OUTPUT_DIR>/lora_modules.json.
    lora:
      enabled: false
      maxRank: 64
      maxLoras: 4
      modules: []  # - { name: tenant-xxxx-lora-yyyy, path: /data/finetuning/output/guided/<job>/adapter }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      queueDepthThreshold: 8 # vllm:num_requests_waiting per pod before scaling out
      cooldownSeconds: 300
      # prometheusUrl: override only if this chart's own bundled Prometheus
      # (templates/observability.yaml) isn't what you scrape from — the
      # default targets that in-cluster Service directly.
    model: "zai-org/GLM-5.3-Flash"
    servedModelName: glm-5.3-flash
    maxModelLen: 131072
    # No dedicated "glm5"/"glm53" tool-parser exists in vLLM — GLM-5.3's
    # chat template emits the same <tool_call> XML format as GLM-4.5/4.7
    # MoE (verified against the model's real chat_template.jinja), which
    # is why "glm47" is the correct --tool-call-parser value.
    toolParser: glm47
    image:
      repository: vllm/vllm-openai
      tag: glm53-flash
    nodeSelector:
      nodepool: gpu-coding
    resources:
      requests: { cpu: "16", memory: "128Gi", nvidia.com/gpu: "8" }
      limits: { cpu: "32", memory: "256Gi", nvidia.com/gpu: "8" }
  # Qwen2.5-Coder-32B-Instruct — coding fallback, used when the `coding`
  # role (GLM-5.3-Flash) is unhealthy (src/inference/model_router.py's
  # FALLBACK_CHAINS). A conventional dense model — uses the chart-wide
  # image.vllm tag, no per-role override needed.
  coding-fallback:
    enabled: false
    gpuCount: 4
    replicas: 1
    nodeCount: 1
    kvCacheDtype: ""
    # Promoted fine-tuned adapters served next to the base model (src/inference/lora_registry.py).
    # enabled also sets VLLM_ALLOW_RUNTIME_LORA_UPDATING so a promotion loads live, no restart;
    # `modules` is the restart-time list — copy it from <FINETUNING_OUTPUT_DIR>/lora_modules.json.
    lora:
      enabled: false
      maxRank: 64
      maxLoras: 4
      modules: []  # - { name: tenant-xxxx-lora-yyyy, path: /data/finetuning/output/guided/<job>/adapter }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      queueDepthThreshold: 8
      cooldownSeconds: 300
    model: "Qwen/Qwen2.5-Coder-32B-Instruct"
    servedModelName: qwen-coder-32b
    maxModelLen: 131072
    toolParser: hermes
    nodeSelector:
      nodepool: gpu-coding
    resources:
      requests: { cpu: "8", memory: "64Gi", nvidia.com/gpu: "4" }
      limits: { cpu: "16", memory: "128Gi", nvidia.com/gpu: "4" }
  reasoning:
    enabled: false
    gpuCount: 2
    replicas: 1
    nodeCount: 1
    kvCacheDtype: ""
    # Promoted fine-tuned adapters served next to the base model (src/inference/lora_registry.py).
    # enabled also sets VLLM_ALLOW_RUNTIME_LORA_UPDATING so a promotion loads live, no restart;
    # `modules` is the restart-time list — copy it from <FINETUNING_OUTPUT_DIR>/lora_modules.json.
    lora:
      enabled: false
      maxRank: 64
      maxLoras: 4
      modules: []  # - { name: tenant-xxxx-lora-yyyy, path: /data/finetuning/output/guided/<job>/adapter }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      queueDepthThreshold: 8
      cooldownSeconds: 300
    model: "deepseek-ai/DeepSeek-R1"
    servedModelName: deepseek-r1
    maxModelLen: 65536
    # DeepSeek-R1 keeps Keystone's own text-protocol tool-calling fallback
    # (src/orchestrator/tools/protocol.py's TextToolProtocol) rather than a
    # vLLM-native tool-parser, so no toolParser is set here.
    nodeSelector:
      nodepool: gpu-reasoning
    resources:
      requests: { cpu: "4", memory: "32Gi", nvidia.com/gpu: "2" }
      limits: { cpu: "8", memory: "64Gi", nvidia.com/gpu: "2" }

modelCache:
  storage: 500Gi
  storageClassName: ""
  # Air-gapped: pre-populated by airgap/import_bundle.sh, not downloaded at pod start.
  hfOffline: true

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: keystone-tls # created by pki/issue_cert.sh (internal CA) or cert-manager
  host: keystone.local

secrets:
  # Client-VPC production: set useOpenBao=true and configure the
  # SecretProviderClass in openbao-secretproviderclass.yaml instead — this
  # dev/test path stores secrets as a plain (auto-generated, stable-across-
  # upgrades) Kubernetes Secret, which is fine for a kind cluster or the
  # RunPod test tier but not the real client deployment.
  useOpenBao: false
  postgresPassword: ""
  redisPassword: ""
  qdrantApiKey: ""
  rootAdminToken: ""
  openbao:
    # Used when useOpenBao=true (templates/openbao-secretproviderclass.yaml): the Secrets Store CSI
    # driver + Vault provider read these keys from OpenBao and sync them into <release>-secrets.
    address: "" # default: the in-chart OpenBao service; set to an external OpenBao/Vault URL otherwise
    role: keystone # the Kubernetes auth role bound to this chart's ServiceAccount
    secretsPath: secret/data/keystone # KV v2 path holding POSTGRES_PASSWORD, REDIS_PASSWORD, QDRANT_API_KEY, KEYSTONE_ROOT_ADMIN_TOKEN, VS_SECRET_KEY, GRAFANA_ADMIN_PASSWORD
    caCertPath: "" # PEM path inside the CSI provider when OpenBao serves TLS from the internal CA

migrations:
  enabled: true # pre-install/pre-upgrade hook Job running `alembic upgrade head` once per release
  backoffLimit: 2
  activeDeadlineSeconds: 900

networkPolicy:
  enabled: true
  egress:
    # Default-deny egress with explicit allows (templates/networkpolicies.yaml). Off by default because
    # it needs the cluster's DNS labels; values-client-vpc.yaml turns it on.
    enabled: false
    dnsNamespace: kube-system
    dnsPodLabels: { k8s-app: kube-dns }
    allowedCIDRs: [] # the git host, package mirrors, a hosted model endpoint — e.g. ["10.20.0.0/16"]
    vllmInternet: false # true only when vLLM must pull weights from a hub; air-gapped sites keep false

training:
  # Multi-GPU fine-tuning (LoRA/SFT/DPO) on a KubeRay RayCluster (templates/kuberay.yaml, ADR 0002):
  # one Ray for serving and training. The KubeRay operator and its CRDs are cluster-scoped shared
  # infrastructure installed separately — see docs/deployment/KUBERNETES_CLIENT_VPC.md. With
  # ray.enabled the app's FINETUNE_BACKEND becomes "ray" and every fine-tune job is submitted to the
  # cluster's head over the Ray Jobs API (src/finetuning/backends/ray_train.py).
  image:
    repository: keystone-training # docker/training.Dockerfile — torch, the trainers, Ray, the GGUF converter
    tag: latest
    pullPolicy: IfNotPresent
  ray:
    enabled: false
    rayVersion: "2.58.0" # must match the ray pinned by the image's `finetuning-ray` extra (pyproject.toml)
    head:
      nodeSelector: {}
      resources:
        requests: { cpu: "2", memory: "8Gi" }
        limits: { cpu: "4", memory: "16Gi" }
    workers:
      replicas: 2 # one Ray Train worker per GPU: replicas x gpusPerWorker GPUs train one job
      minReplicas: 0 # KubeRay's autoscaler may scale the group to zero between jobs
      maxReplicas: 4
      gpusPerWorker: 1
      shmSize: 8Gi # /dev/shm for NCCL and the data loaders
      nodeSelector:
        nodepool: gpu-coding
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      resources: # nvidia.com/gpu is added from gpusPerWorker
        requests: { cpu: "8", memory: "64Gi" }
        limits: { cpu: "16", memory: "128Gi" }
  output:
    # The finetuning-output PVC: adapters, datasets and Ray run storage, mounted at /data/finetuning
    # on every Ray pod (and on the serving pods, so a promoted adapter is readable there).
    storage: 200Gi
    storageClassName: "" # must be RWX-capable (NFS/EFS/Filestore) — shared across GPU nodes

observability:
  enabled: true
  prometheus:
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1", memory: "2Gi" }
    storage: 20Gi
  grafana:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  alertmanager:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  loki:
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1", memory: "1Gi" }
    storage: 20Gi
  promtail:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
