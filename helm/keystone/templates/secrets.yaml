#
# Dev/test-tier secrets. For a real client-VPC production install, set
# secrets.useOpenBao=true instead (see openbao-secretproviderclass.yaml) —
# that mounts live-leased secrets from OpenBao via the Secrets Store CSI
# driver, so nothing sensitive sits in a plain Kubernetes Secret object at
# rest. This template exists for the dev/test tier and for bootstrapping
# OpenBao itself before the CSI path is wired up.
#
# Values are generated once and preserved across `helm upgrade` via the
# `lookup` pattern below (a plain re-render would otherwise rotate every
# secret on every upgrade, which is never what you want).
{{- if not .Values.secrets.useOpenBao }}
{{- $fullname := include "keystone.fullname" . }}
{{- $secretName := printf "%s-secrets" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := (default (dict) (default (dict) $existing).data) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "keystone.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ (get $existingData "POSTGRES_PASSWORD") | default (.Values.secrets.postgresPassword | default (randAlphaNum 32) | b64enc) }}
  REDIS_PASSWORD: {{ (get $existingData "REDIS_PASSWORD") | default (.Values.secrets.redisPassword | default (randAlphaNum 32) | b64enc) }}
  QDRANT_API_KEY: {{ (get $existingData "QDRANT_API_KEY") | default (.Values.secrets.qdrantApiKey | default (randAlphaNum 32) | b64enc) }}
  KEYSTONE_ROOT_ADMIN_TOKEN: {{ (get $existingData "KEYSTONE_ROOT_ADMIN_TOKEN") | default (.Values.secrets.rootAdminToken | default (randAlphaNum 48) | b64enc) }}
  VS_SECRET_KEY: {{ (get $existingData "VS_SECRET_KEY") | default (randAlphaNum 64 | b64enc) }}
  GRAFANA_ADMIN_PASSWORD: {{ (get $existingData "GRAFANA_ADMIN_PASSWORD") | default (randAlphaNum 32 | b64enc) }}
{{- end }}
