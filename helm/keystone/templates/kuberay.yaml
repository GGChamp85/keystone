#
# Multi-GPU fine-tuning (LoRA/SFT/DPO) on a KubeRay RayCluster — ADR 0002:
# Ray Train via KubeRay, the same Ray the chart already uses for multi-node
# vLLM serving, instead of a second scheduler (the Kubeflow Trainer runtime
# this template replaces).
#
# The KubeRay operator and its RayCluster CRD (ray.io/v1) are cluster-scoped
# shared infrastructure installed once per cluster, not by this chart — see
# docs/deployment/KUBERNETES_CLIENT_VPC.md. This template declares Keystone's
# own RayCluster: a head (no GPU; the dashboard the app submits jobs to over
# the Ray Jobs API, src/finetuning/backends/ray_train.py) and a GPU worker
# group, both running docker/training.Dockerfile's image, with the shared
# model cache and the fine-tuning output PVC mounted on every pod so a
# worker's adapter lands where the serving pods read it.
{{- if .Values.training.ray.enabled }}
{{- $ray := .Values.training.ray }}
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ include "keystone.fullname" . }}-training
  labels: {{- include "keystone.labels" . | nindent 4 }}
    app.kubernetes.io/component: training
spec:
  rayVersion: {{ $ray.rayVersion | quote }}
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-gpus: "0" # the head schedules; only the worker group trains
    template:
      metadata:
        labels:
          app.kubernetes.io/component: training-head
      spec:
        {{- with .Values.global.imagePullSecrets }}
        imagePullSecrets: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ray.head.nodeSelector }}
        nodeSelector: {{- toYaml . | nindent 10 }}
        {{- end }}
        containers:
          - name: ray-head
            image: {{ include "keystone.image" (dict "root" $ "image" .Values.training.image) }}
            imagePullPolicy: {{ .Values.training.image.pullPolicy }}
            ports:
              - { name: gcs, containerPort: 6379 }
              - { name: dashboard, containerPort: 8265 }
              - { name: client, containerPort: 10001 }
            envFrom:
              - configMapRef: { name: {{ include "keystone.fullname" . }}-config }
            env:
              - name: HF_HUB_OFFLINE
                value: {{ .Values.modelCache.hfOffline | ternary "1" "0" | quote }}
            resources: {{- toYaml $ray.head.resources | nindent 14 }}
            volumeMounts:
              - name: model-cache
                mountPath: /home/trainer/.cache/huggingface
              - name: finetuning-output
                mountPath: /data/finetuning
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: {{ include "keystone.fullname" . }}-model-cache
          - name: finetuning-output
            persistentVolumeClaim:
              claimName: {{ include "keystone.fullname" . }}-finetuning-output
  workerGroupSpecs:
    - groupName: gpu
      replicas: {{ $ray.workers.replicas }}
      minReplicas: {{ $ray.workers.minReplicas }}
      maxReplicas: {{ $ray.workers.maxReplicas }}
      rayStartParams:
        num-gpus: {{ $ray.workers.gpusPerWorker | quote }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: training-worker
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ray.workers.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ray.workers.tolerations }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: ray-worker
              image: {{ include "keystone.image" (dict "root" $ "image" .Values.training.image) }}
              imagePullPolicy: {{ .Values.training.image.pullPolicy }}
              envFrom:
                - configMapRef: { name: {{ include "keystone.fullname" . }}-config }
              env:
                - name: HF_HUB_OFFLINE
                  value: {{ .Values.modelCache.hfOffline | ternary "1" "0" | quote }}
              resources:
                requests: {{- toYaml $ray.workers.resources.requests | nindent 18 }}
                  nvidia.com/gpu: {{ $ray.workers.gpusPerWorker | quote }}
                limits: {{- toYaml $ray.workers.resources.limits | nindent 18 }}
                  nvidia.com/gpu: {{ $ray.workers.gpusPerWorker | quote }}
              volumeMounts:
                - name: model-cache
                  mountPath: /home/trainer/.cache/huggingface
                - name: finetuning-output
                  mountPath: /data/finetuning
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: {{ include "keystone.fullname" . }}-model-cache
            - name: finetuning-output
              persistentVolumeClaim:
                claimName: {{ include "keystone.fullname" . }}-finetuning-output
            - name: dshm # NCCL and the data loaders need more than the container default 64 MiB
              emptyDir: { medium: Memory, sizeLimit: {{ $ray.workers.shmSize }} }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "keystone.fullname" . }}-finetuning-output
  labels: {{- include "keystone.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"] # every Ray pod and the serving pods read it — the same RWX need as modelCache
  {{- if .Values.training.output.storageClassName }}
  storageClassName: {{ .Values.training.output.storageClassName }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.training.output.storage }} }
{{- end }}
