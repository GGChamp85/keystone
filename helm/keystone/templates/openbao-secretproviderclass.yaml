#
# Production secrets from OpenBao through the Secrets Store CSI driver (secrets.useOpenBao=true).
#
# Prerequisites on the cluster (shared infrastructure, installed once — see docs/deployment/KUBERNETES_CLIENT_VPC.md):
#   - secrets-store-csi-driver with `syncSecret.enabled=true`
#   - the Vault CSI provider (OpenBao speaks the same API; the provider binary is `vault-csi-provider`)
#   - a Kubernetes auth role in OpenBao (`secrets.openbao.role`) bound to this chart's ServiceAccount,
#     with read on `secrets.openbao.secretsPath` (KV v2), holding the keys listed under `objects` below.
#
# The app and worker pods mount this class (templates/app.yaml, worker.yaml); the CSI driver then keeps a
# Kubernetes Secret named `<release>-secrets` in sync with OpenBao (`secretObjects`), which is the same
# name the dev-tier templates/secrets.yaml would have created — so every `secretKeyRef` in the chart is
# unchanged and rotation in OpenBao reaches the pods on their next restart.
{{- if .Values.secrets.useOpenBao }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keystone.fullname" . }}-openbao
  labels: {{- include "keystone.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.secrets.openbao.address | default (printf "http://%s-openbao:8200" (include "keystone.fullname" .)) | quote }}
    roleName: {{ .Values.secrets.openbao.role | quote }}
    {{- if .Values.secrets.openbao.caCertPath }}
    vaultCACertPath: {{ .Values.secrets.openbao.caCertPath | quote }}
    {{- end }}
    objects: |
      {{- range $key := list "POSTGRES_PASSWORD" "REDIS_PASSWORD" "QDRANT_API_KEY" "KEYSTONE_ROOT_ADMIN_TOKEN" "VS_SECRET_KEY" "GRAFANA_ADMIN_PASSWORD" }}
      - objectName: {{ $key | quote }}
        secretPath: {{ $.Values.secrets.openbao.secretsPath | quote }}
        secretKey: {{ $key | quote }}
      {{- end }}
  secretObjects:
    - secretName: {{ include "keystone.fullname" . }}-secrets
      type: Opaque
      data:
        {{- range $key := list "POSTGRES_PASSWORD" "REDIS_PASSWORD" "QDRANT_API_KEY" "KEYSTONE_ROOT_ADMIN_TOKEN" "VS_SECRET_KEY" "GRAFANA_ADMIN_PASSWORD" }}
        - objectName: {{ $key | quote }}
          key: {{ $key | quote }}
        {{- end }}
{{- end }}
