apiVersion: v1
kind: Service
metadata:
  name: {{ include "keystone.fullname" . }}-app
  labels: {{- include "keystone.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
      name: http
  selector:
    {{- include "keystone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keystone.fullname" . }}-app
  labels: {{- include "keystone.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  # Zero-downtime rollouts: never take a replica away before its replacement is Ready, and give
  # in-flight requests (streams included) time to finish via preStop + the grace period.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.app.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "keystone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "keystone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.app.rollout.terminationGracePeriodSeconds }}
      {{- if .Values.secrets.useOpenBao }}
      volumes:
        - name: openbao-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "keystone.fullname" . }}-openbao
      {{- end }}
      containers:
        - name: app
          image: {{ include "keystone.image" (dict "root" $ "image" .Values.image.app) }}
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef: { name: {{ include "keystone.fullname" . }}-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "keystone.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "keystone.fullname" . }}-secrets, key: REDIS_PASSWORD } }
            - name: QDRANT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "keystone.fullname" . }}-secrets, key: QDRANT_API_KEY } }
            - name: KEYSTONE_ROOT_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "keystone.fullname" . }}-secrets, key: KEYSTONE_ROOT_ADMIN_TOKEN } }
            - name: VS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "keystone.fullname" . }}-secrets, key: VS_SECRET_KEY } }
            - name: DATABASE_URL
              value: "postgresql+asyncpg://keystone:$(POSTGRES_PASSWORD)@{{ include "keystone.fullname" . }}-postgres:5432/keystone"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "keystone.fullname" . }}-redis:6379/0"
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ .Values.app.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: {{ .Values.app.port }} }
            initialDelaySeconds: 20
            periodSeconds: 30
          lifecycle:
            preStop:
              # let the Service/endpoint update propagate before the process gets SIGTERM
              exec: { command: ["sleep", "{{ .Values.app.rollout.preStopSeconds }}"] }
          {{- if .Values.secrets.useOpenBao }}
          volumeMounts:
            - name: openbao-secrets
              mountPath: /var/run/secrets/openbao
              readOnly: true
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      # Migrations run once per release as a pre-install/pre-upgrade hook Job (templates/migrate-job.yaml),
      # not as an initContainer racing on every replica.
---
{{- if .Values.app.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "keystone.fullname" . }}-app
  labels: {{- include "keystone.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "keystone.fullname" . }}-app
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
