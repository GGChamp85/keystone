apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keystone.fullname" . }}-config
  labels: {{- include "keystone.labels" . | nindent 4 }}
data:
  VS_ENV: {{ .Values.global.environment | quote }}
  VS_PLATFORM_NAME: "Keystone"
  POSTGRES_HOST: {{ include "keystone.fullname" . }}-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "keystone"
  POSTGRES_USER: "keystone"
  REDIS_HOST: {{ include "keystone.fullname" . }}-redis
  QDRANT_HOST: {{ include "keystone.fullname" . }}-qdrant
  QDRANT_PORT: "6333"
  SANDBOX_DAEMON_URL: "http://{{ include "keystone.fullname" . }}-sandbox-daemon:9000"
  SANDBOX_BACKEND: {{ .Values.sandboxDaemon.backend | quote }}
  TEMPORAL_HOST: {{ include "keystone.fullname" . }}-temporal:7233
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  VLLM_CODING_URL: "http://{{ include "keystone.fullname" . }}-vllm-coding:8000/v1"
  VLLM_CODING_FALLBACK_URL: "http://{{ include "keystone.fullname" . }}-vllm-coding-fallback:8000/v1"
  VLLM_REASONING_URL: "http://{{ include "keystone.fullname" . }}-vllm-reasoning:8000/v1"
  {{- if .Values.modelCache.hfOffline }}
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  {{- end }}
  {{- if .Values.training.ray.enabled }}
  # Fine-tuning jobs run as Ray Train jobs on the RayCluster in kuberay.yaml (ADR 0002); the app submits
  # them to the head's dashboard (KubeRay names the Service <cluster>-head-svc) and the adapters land on
  # the shared finetuning-output PVC every Ray pod mounts at /data/finetuning.
  FINETUNE_BACKEND: "ray"
  RAY_ADDRESS: "http://{{ include "keystone.fullname" . }}-training-head-svc:8265"
  FINETUNING_OUTPUT_DIR: "/data/finetuning/output"
  FINETUNING_DATA_DIR: "/data/finetuning/data"
  {{- end }}
