#
# Multi-node distributed fine-tuning (LoRA/SFT/DPO), via the Kubeflow
# Trainer project (github.com/kubeflow/training-operator, Apache-2.0).
#
# IMPORTANT — API note: as of the project's current release (v2.3.0), the
# CRDs are TrainJob/TrainingRuntime/ClusterTrainingRuntime under the
# trainer.kubeflow.org/v1alpha1 API group — NOT the older PyTorchJob
# (kubeflow.org/v1) API many existing docs/tutorials still reference. This
# chart targets the current, real API, checked against the project's own
# example manifests (examples/yaml/*.yaml at that tag), not assumed from
# memory of the older API.
#
# The Kubeflow Trainer controller + its own CRDs are installed separately
# (it's not part of this chart — it's cluster-scoped, shared infrastructure,
# typically installed once per cluster): see
# docs/deployment/KUBERNETES_CLIENT_VPC.md for the install command. This
# template only defines Keystone's OWN ClusterTrainingRuntime (our
# fine-tuning image + GPU node placement), which TrainJobs then reference.
{{- if .Values.training.enabled }}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: {{ include "keystone.fullname" . }}-finetune-runtime
  labels: {{- include "keystone.labels" . | nindent 4 }}
    app.kubernetes.io/component: training-runtime
spec:
  mlPolicy:
    numNodes: {{ .Values.training.defaultNumNodes }}
    torch:
      numProcPerNode: {{ .Values.training.gpusPerNode | quote }}
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  {{- with .Values.training.nodeSelector }}
                  nodeSelector: {{- toYaml . | nindent 20 }}
                  {{- end }}
                  tolerations:
                    - key: nvidia.com/gpu
                      operator: Exists
                      effect: NoSchedule
                  containers:
                    - name: node
                      image: {{ include "keystone.image" (dict "root" $ "image" .Values.image.app) }}
                      envFrom:
                        - configMapRef: { name: {{ include "keystone.fullname" . }}-config }
                      env:
                        - name: HF_HUB_OFFLINE
                          value: {{ .Values.modelCache.hfOffline | ternary "1" "0" | quote }}
                      resources: {{- toYaml .Values.training.resourcesPerNode | nindent 24 }}
                      volumeMounts:
                        - name: model-cache
                          mountPath: /root/.cache/huggingface
                        - name: finetuning-data
                          mountPath: /data/finetuning
                  volumes:
                    - name: model-cache
                      persistentVolumeClaim:
                        claimName: {{ include "keystone.fullname" . }}-model-cache
                    - name: finetuning-data
                      persistentVolumeClaim:
                        claimName: {{ include "keystone.fullname" . }}-finetuning-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "keystone.fullname" . }}-finetuning-data
  labels: {{- include "keystone.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"] # shared across training nodes, same RWX requirement as modelCache
  {{- if .Values.training.storageClassName }}
  storageClassName: {{ .Values.training.storageClassName }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.training.storage }} }
{{- end }}
