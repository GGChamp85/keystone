name: Feature request
description: Suggest an idea or improvement for Keystone
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Check the [ROADMAP.md](../../ROADMAP.md) first — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Keystone doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch it out if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: constraint
    attributes:
      label: Does this need to work air-gapped / fully self-hosted?
      description: Keystone's core requirement is zero managed-SaaS dependencies in production — flag if your request would conflict with that.
      options:
        - "Yes, must work air-gapped"
        - "No, connected-tier only is fine (e.g. build/eval tooling)"
        - "Not sure"
    validations:
      required: true
