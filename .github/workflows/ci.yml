name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff) + type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ benchmarks/
      - run: ruff format --check src/ tests/ benchmarks/
      - name: mypy (zero errors — configured in pyproject.toml [tool.mypy])
        run: mypy
      - name: uv.lock is in sync with pyproject.toml
        run: pip install uv && uv lock --check
      - name: repo-facing text stays vendor-neutral (ADR 0006)
        run: scripts/check_vendor_neutral.sh README.md CHANGELOG.md ROADMAP.md $(find docs -name '*.md') vscode/extension/README.md vscode/extension/CHANGELOG.md
      - name: task event types are identical in web/src/api.ts and vscode/extension/src/api.ts
        run: python scripts/check_ts_types_in_sync.py

  test:
    name: Test (pytest, real Postgres/Redis/Qdrant/Docker sandbox)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: keystone
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://keystone:ci-test-password@localhost:5432/keystone
      POSTGRES_PASSWORD: ci-test-password
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ci-test-key
      KEYSTONE_ROOT_ADMIN_TOKEN: ci-test-root-admin-token
      VS_SECRET_KEY: ci-test-secret-key-64-characters-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      VS_ENV: development
      SANDBOX_DAEMON_URL: http://localhost:9000
      # A real OpenAI-compatible model backend for the whole job: llama.cpp
      # serving Qwen2.5-Coder-0.5B on CPU (see docker-compose.yml's
      # demo-model profile). Tests that need a model run for real against it.
      VLLM_CODING_URL: http://localhost:8090/v1
      CODING_MODEL_ID: demo-coder
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Build sandbox runtime image (required before any sandbox can be created — see `make sandbox-images`)
        run: make sandbox-images
      - name: Start sandbox daemon (real Docker, gVisor-or-runc backend)
        run: |
          nohup python -m uvicorn src.sandbox.daemon:app --host 0.0.0.0 --port 9000 > sandbox-daemon.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/health && break; sleep 1; done
      - name: Cache the demo model GGUF (676 MB — downloaded once, reused across runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp
          key: llama-cpp-gguf-Qwen2.5-Coder-0.5B-Instruct-Q8_0
      - name: Start demo model (real llama.cpp server, Qwen2.5-Coder-0.5B on CPU — the OpenAI-compatible backend every model-dependent test runs against)
        run: |
          mkdir -p ~/.cache/llama.cpp
          docker run -d --name demo-model -p 8090:8000 \
            -v ~/.cache/llama.cpp:/root/.cache/llama.cpp -e LLAMA_CACHE=/root/.cache/llama.cpp \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF:Q8_0 --alias demo-coder \
            --jinja --host 0.0.0.0 --port 8000 -c 8192 --n-predict 2048
          # First run downloads the GGUF; cached runs load in seconds. 503 while loading, 200 when ready.
          for i in $(seq 1 120); do curl -sf http://localhost:8090/health && break; sleep 3; done
          curl -sf http://localhost:8090/v1/models
      - name: Demo model log (on failure)
        if: failure()
        run: docker logs demo-model 2>&1 | tail -50
      - name: pytest (unit + integration — integration tests self-skip only if a required service is unreachable)
        run: python -m pytest tests/ -v --tb=short
      - name: Restore drill (a dump of the CI database restores into a fresh Postgres with the same revision and row counts)
        run: DRILL_PORT=55432 bash scripts/restore_drill.sh --from-url postgresql://keystone:ci-test-password@localhost:5432/keystone
      - uses: grafana/setup-k6-action@v1
      - name: Load-test smoke (k6 against the real app and the CPU demo model)
        run: VUS=2 DURATION=15s bash scripts/k6_smoke.sh k6-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: k6-smoke.json
      - name: Sandbox daemon log (on failure)
        if: failure()
        run: cat sandbox-daemon.log

  train-smoke:
    name: Trainer smoke (real LoRA run on a 0.5B model, CPU, Python 3.12)
    runs-on: ubuntu-latest
    env:
      KEYSTONE_TRAINING_SMOKE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache the Hugging Face hub (the 0.5B base model, ~1 GB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-Qwen2.5-Coder-0.5B-Instruct
      - name: Install the training stack (CPU torch + the `finetuning` extra — the same set docker/training.Dockerfile installs)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[finetuning,dev]"
      - name: Run the real trainer smoke
        run: python -m pytest tests/test_trainer_smoke.py -v --tb=short

  docs:
    name: Docs (truth-in-docs claims, generated config reference, mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the lockfile (the generated references depend on exact library versions)
        run: pip install uv && uv sync --frozen --extra dev --extra docs
      - name: Configuration reference is generated from src/config.py and current
        run: uv run python scripts/gen_config_reference.py --check
      - name: CLI and API references are generated from the code and current
        run: uv run python scripts/gen_cli_reference.py --check
      - name: Every documented claim names a test that exists
        run: uv run python scripts/check_claims.py
      - name: Documentation site builds with no warnings
        run: uv run mkdocs build --strict

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/keystone --set training.ray.enabled=true --set observability.enabled=true
      - run: helm template keystone-ci helm/keystone --set observability.enabled=true --set training.ray.enabled=true > /dev/null
      - name: helm template — the KubeRay training cluster (ADR 0002) renders a RayCluster with a GPU worker group
        run: |
          helm template keystone-ci helm/keystone --set training.ray.enabled=true > /tmp/render-ray.yaml
          grep -q "kind: RayCluster" /tmp/render-ray.yaml
          grep -q "apiVersion: ray.io/v1" /tmp/render-ray.yaml
          grep -q "nvidia.com/gpu" /tmp/render-ray.yaml
          grep -q "keystone-ci-finetuning-output" /tmp/render-ray.yaml
          grep -q 'FINETUNE_BACKEND: "ray"' /tmp/render-ray.yaml
          # The Kubeflow runtime is gone (ADR 0002), not merely disabled.
          if grep -q "trainer.kubeflow.org" /tmp/render-ray.yaml; then echo "Kubeflow runtime still rendered" >&2; exit 1; fi
      - name: helm template — single-node vLLM roles enabled (the default replicas=1/nodeCount=1 path)
        run: |
          helm lint helm/keystone --set vllm.coding.enabled=true --set vllm.coding-fallback.enabled=true --set vllm.reasoning.enabled=true
          helm template keystone-ci helm/keystone --set vllm.coding.enabled=true --set vllm.coding-fallback.enabled=true --set vllm.reasoning.enabled=true > /dev/null
      - name: helm template — multi-node (nodeCount>1) and KEDA autoscaling branches
        run: |
          helm template keystone-ci helm/keystone --set vllm.coding.enabled=true --set vllm.coding.nodeCount=2 > /dev/null
          helm template keystone-ci helm/keystone --set vllm.coding.enabled=true --set vllm.coding.replicas=3 --set vllm.coding.autoscaling.enabled=true > /dev/null
      - name: helm lint + template — the AWS / Azure / GCP overlays stacked on values-client-vpc.yaml (what `keystone deploy cloud --helm-install` runs)
        run: |
          for cloud in aws azure gcp; do
            helm lint helm/keystone -f helm/keystone/values-client-vpc.yaml -f "helm/keystone/values-${cloud}.yaml"
            helm template keystone helm/keystone -f helm/keystone/values-client-vpc.yaml -f "helm/keystone/values-${cloud}.yaml" > "/tmp/render-${cloud}.yaml"
            # The overlay must actually clear the client-VPC placeholders, not just render.
            if grep -q "sandbox-capable" "/tmp/render-${cloud}.yaml"; then echo "values-${cloud}.yaml left the sandbox-capable nodeSelector in place" >&2; exit 1; fi
            grep -q "storageClassName: keystone-" "/tmp/render-${cloud}.yaml"
          done

  iac-validate:
    name: IaC (OpenTofu fmt + init -backend=false + validate, no cloud credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"
      - name: tofu fmt -check (every module and environment)
        run: tofu fmt -check -recursive -diff infra/opentofu
      - name: tofu init -backend=false + validate — modules
        run: |
          for module in infra/opentofu/modules/aws-eks-gpu infra/opentofu/modules/azure-aks-gpu infra/opentofu/modules/gcp-gke-gpu; do
            echo "== $module"
            tofu -chdir="$module" init -backend=false -input=false -no-color
            tofu -chdir="$module" validate -no-color
          done
      - name: tofu init -backend=false + validate — environments
        # runpod-test is deliberately not in this list: its provider (runpod/runpod) ships a
        # malformed data-source schema that makes `validate` fail before reading any HCL — see
        # the comment in infra/opentofu/modules/runpod-gpu-pool/main.tf. Add it here once a
        # provider release fixes that.
        run: |
          for env in infra/opentofu/environments/aws-pilot infra/opentofu/environments/azure-pilot infra/opentofu/environments/gcp-pilot; do
            echo "== $env"
            tofu -chdir="$env" init -backend=false -input=false -no-color
            tofu -chdir="$env" validate -no-color
          done

  shellcheck:
    name: Shellcheck (airgap/, pki/, scripts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all tracked shell scripts
        run: |
          find airgap pki scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

  docker-compose-config:
    name: docker compose config validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test-password
      REDIS_PASSWORD: ci-test-password
      QDRANT_API_KEY: ci-test-key
      KEYSTONE_ROOT_ADMIN_TOKEN: ci-test-root-admin-token
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  vscode-extension:
    name: VS Code extension (typecheck, unit tests on recorded frames, host test, .vsix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/extension/package-lock.json
      - run: npm ci
      - name: typecheck + vitest (SSE decoder, renderer and model picker on the recorded real fixtures)
        run: npm test
      - name: VS Code host test (activation + commands; the live submit test self-skips without KEYSTONE_URL/KEYSTONE_API_KEY)
        run: xvfb-run -a npm run test:integration
      - name: package the .vsix
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: keystone-agents-vsix
          path: vscode/extension/keystone-agents.vsix
          if-no-files-found: error

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: keystone-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
