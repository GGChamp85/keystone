name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ benchmarks/
      - run: ruff format --check src/ tests/ benchmarks/

  test:
    name: Test (pytest, real Postgres/Redis/Qdrant/Docker sandbox)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: keystone
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://keystone:ci-test-password@localhost:5432/keystone
      POSTGRES_PASSWORD: ci-test-password
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ci-test-key
      KEYSTONE_ROOT_ADMIN_TOKEN: ci-test-root-admin-token
      VS_SECRET_KEY: ci-test-secret-key-64-characters-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      VS_ENV: development
      SANDBOX_DAEMON_URL: http://localhost:9000
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Build sandbox runtime image (required before any sandbox can be created — see `make sandbox-images`)
        run: make sandbox-images
      - name: Start sandbox daemon (real Docker, gVisor-or-runc backend)
        run: |
          nohup python -m uvicorn src.sandbox.daemon:app --host 0.0.0.0 --port 9000 > sandbox-daemon.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/health && break; sleep 1; done
      - name: pytest (unit + integration — integration tests self-skip only if a required service is unreachable)
        run: python -m pytest tests/ -v --tb=short
      - name: Sandbox daemon log (on failure)
        if: failure()
        run: cat sandbox-daemon.log

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/keystone --set training.enabled=true --set observability.enabled=true
      - run: helm template keystone-ci helm/keystone --set observability.enabled=true --set training.enabled=true > /dev/null

  shellcheck:
    name: Shellcheck (airgap/, pki/, scripts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all tracked shell scripts
        run: |
          find airgap pki scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

  docker-compose-config:
    name: docker compose config validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test-password
      REDIS_PASSWORD: ci-test-password
      QDRANT_API_KEY: ci-test-key
      KEYSTONE_ROOT_ADMIN_TOKEN: ci-test-root-admin-token
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: keystone-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
